name: Worldforge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Test server and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Worldforge source
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/source/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/worldforge.zip
          echo "755eb316780eae4531240ca9eeba82254b9b0b3000860248fa05a1f754f7e4c4  /tmp/worldforge.zip" | sha256sum -c -
          rm -rf work
          mkdir -p work
          unzip -q /tmp/worldforge.zip -d work
          test -f work/server/package.json
          test -f work/android/app/build.gradle
          echo "Worldforge source archive verified and unpacked."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: work/server/package-lock.json

      - name: Install server dependencies
        working-directory: work/server
        run: npm ci --ignore-scripts

      - name: Run backend tests
        working-directory: work/server
        run: npm test

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Confirm Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36' || true
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Build debug APK
        working-directory: work/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: worldforge-debug-apk
          path: work/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worldforge-build-reports
          path: |
            work/android/app/build/reports/**
            work/android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
