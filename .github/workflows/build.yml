name: Worldforge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Test server and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Worldforge source
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/source/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/worldforge.zip
          echo "755eb316780eae4531240ca9eeba82254b9b0b3000860248fa05a1f754f7e4c4  /tmp/worldforge.zip" | sha256sum -c -
          rm -rf work
          mkdir -p work
          unzip -q /tmp/worldforge.zip -d work
          test -f work/server/package.json
          test -f work/android/app/build.gradle

      - name: Apply physical-phone server UX patch
        shell: bash
        run: |
          set -euo pipefail
          patch -p1 -d work < .ci/v042-phone-server.patch
          grep -q "versionName '0.4.2'" work/android/app/build.gradle
          grep -q "TEST SERVER CONNECTION" work/android/app/src/main/java/com/worldforge/app/MainActivity.java

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: work/server/package-lock.json

      - name: Install server dependencies
        working-directory: work/server
        run: npm ci --ignore-scripts

      - name: Run backend tests
        working-directory: work/server
        run: npm test

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Build debug APK
        working-directory: work/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: worldforge-debug-apk
          path: work/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worldforge-build-reports
          path: |
            work/android/app/build/reports/**
            work/android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
