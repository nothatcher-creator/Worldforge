name: RoomForge M8 CI
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-roomforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Reconstruct RoomForge source
        shell: bash
        run: |
          set -euo pipefail
          cat roomforge_parts/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/roomforge.zip
          echo "f1a0b0af99ffe1543322580e00c5cc332a5eb3fec7d7731e311db160f24aea2e  /tmp/roomforge.zip" | sha256sum -c -
          rm -rf /tmp/roomforge-src /tmp/roomforge-m4-overlay /tmp/roomforge-m5-overlay /tmp/roomforge-m6-overlay /tmp/roomforge-m7-overlay /tmp/roomforge-m8-overlay
          mkdir -p /tmp/roomforge-src /tmp/roomforge-m4-overlay /tmp/roomforge-m5-overlay /tmp/roomforge-m6-overlay /tmp/roomforge-m7-overlay /tmp/roomforge-m8-overlay
          unzip -q /tmp/roomforge.zip -d /tmp/roomforge-src
          test -f /tmp/roomforge-src/RoomForgeGameify/app/build.gradle.kts
          cp -R roomforge_m2_overlay/. /tmp/roomforge-src/RoomForgeGameify/
          cp -R roomforge_m3_overlay/. /tmp/roomforge-src/RoomForgeGameify/

          tr -d '\r\n' < roomforge_m4_overlay.zip.b64 | base64 --decode > /tmp/roomforge-m4-overlay.zip
          echo "12f0e4c6673ba99b1f467c2b2bee2d98d089daeaca96403d38d04cd06c259e04  /tmp/roomforge-m4-overlay.zip" | sha256sum -c -
          unzip -q /tmp/roomforge-m4-overlay.zip -d /tmp/roomforge-m4-overlay
          cp -R /tmp/roomforge-m4-overlay/roomforge_m4_overlay/. /tmp/roomforge-src/RoomForgeGameify/

          cat roomforge_m5_parts/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/roomforge-m5-overlay.zip
          echo "ae8efe5bcf523cbaae9c8aaa89b4bf9215f1ca2b357a221b0a0317b9546ea032  /tmp/roomforge-m5-overlay.zip" | sha256sum -c -
          unzip -q /tmp/roomforge-m5-overlay.zip -d /tmp/roomforge-m5-overlay
          cp -R /tmp/roomforge-m5-overlay/roomforge_m5_overlay/. /tmp/roomforge-src/RoomForgeGameify/

          cat roomforge_m6_parts/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/roomforge-m6-overlay.zip
          echo "9259e83d3e06b7d8953dd72f0482f2dabb384164f9b7e6b715def25b1904e7c8  /tmp/roomforge-m6-overlay.zip" | sha256sum -c -
          unzip -q /tmp/roomforge-m6-overlay.zip -d /tmp/roomforge-m6-overlay
          cp -R /tmp/roomforge-m6-overlay/roomforge_m6_overlay/. /tmp/roomforge-src/RoomForgeGameify/

          cat roomforge_m7_parts/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/roomforge-m7-overlay.zip
          echo "0f0318fa42da349120f81d2d4fd940e63be86fe4bcfd3bff47e3efa0f604fc4f  /tmp/roomforge-m7-overlay.zip" | sha256sum -c -
          unzip -q /tmp/roomforge-m7-overlay.zip -d /tmp/roomforge-m7-overlay
          cp -R /tmp/roomforge-m7-overlay/roomforge_m7_overlay/. /tmp/roomforge-src/RoomForgeGameify/

          cat roomforge_m8_parts/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/roomforge-m8-overlay.zip
          echo "4d889cd7c100ad2371480b2f72a51c74fcb5461fbb351b485a47ecb30dbad040  /tmp/roomforge-m8-overlay.zip" | sha256sum -c -
          unzip -q /tmp/roomforge-m8-overlay.zip -d /tmp/roomforge-m8-overlay
          cp -R /tmp/roomforge-m8-overlay/roomforge_m8_overlay/. /tmp/roomforge-src/RoomForgeGameify/
          grep -q 'versionName = "0.8.0-m8"' /tmp/roomforge-src/RoomForgeGameify/app/build.gradle.kts

      - name: Download on-device detector model
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=/tmp/roomforge-src/RoomForgeGameify/app/src/main/assets
          mkdir -p "$ASSETS"
          curl -fL --retry 3 --retry-delay 2             -o "$ASSETS/efficientdet_lite0.tflite"             "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite"
          test -s "$ASSETS/efficientdet_lite0.tflite"
          sha256sum "$ASSETS/efficientdet_lite0.tflite"

      - name: Generate original low-poly GLB asset pack
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/roomforge-src/RoomForgeGameify
          python3 "$ROOT/tools/generate_lowpoly_assets.py" "$ROOT/app/src/main/assets/models"
          test -s "$ROOT/app/src/main/assets/models/manifest.json"
          test -s "$ROOT/app/src/main/assets/models/cartoon_couch_01.glb"
          test -s "$ROOT/app/src/main/assets/models/cartoon_couch_02.glb"
          test "$(find "$ROOT/app/src/main/assets/models" -name '*.glb' | wc -l)" -eq 22
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path("/tmp/roomforge-src/RoomForgeGameify/app/src/main/assets/models/manifest.json")
          data=json.loads(p.read_text())
          counts=Counter(a["category"] for a in data["assets"])
          assert len(data["assets"]) == 22
          assert all(v == 2 for v in counts.values()), counts
          PY

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build RoomForge debug APK
        working-directory: /tmp/roomforge-src/RoomForgeGameify
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Inspect APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/roomforge-src/RoomForgeGameify/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.roomforge.gameify'" /tmp/apk-badging.txt
          grep -q "versionName='0.8.0-m8'" /tmp/apk-badging.txt
          grep -q "application-label:'RoomForge'" /tmp/apk-badging.txt
          unzip -l "$APK" | grep -q 'assets/models/manifest.json'
          unzip -l "$APK" | grep -q 'assets/models/cartoon_couch_01.glb'
          unzip -l "$APK" | grep -q 'assets/models/cartoon_couch_02.glb'
          test "$(unzip -l "$APK" | grep -c 'assets/models/.*\.glb')" -eq 22

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roomforge-m8-debug-apk
          path: /tmp/roomforge-src/RoomForgeGameify/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: roomforge-m8-source
          path: /tmp/roomforge-src/RoomForgeGameify
          if-no-files-found: error
          retention-days: 7
