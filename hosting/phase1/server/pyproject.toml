[project]
name = "worldforge-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.3",
    "psycopg[binary]==3.2.12",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "websockets==15.0.1", "ruff==0.11.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

